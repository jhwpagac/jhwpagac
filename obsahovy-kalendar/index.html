<style id="app-style">
/* Layout: sticky toolbar, then a two-column workspace — month grid (or agenda on phones) + "this week" rail */
:root{

  --shadow:0 10px 30px rgba(20,32,60,.14);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --fg:#e6ebf3; --muted:#9aa6b8; --accent:#7f9cff; --accent-fg:#0b1020;
  --warn:#f0a54a; --warn-bg:#33240f; --bad:#ff7b8a; --bad-bg:#3a1820; --ok:#5fd394; --ok-bg:#12301f;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{

  --fg:#e6ebf3; --muted:#9aa6b8; --accent:#7f9cff; --accent-fg:#0b1020;
  --warn:#f0a54a; --warn-bg:#33240f; --bad:#ff7b8a; --bad-bg:#3a1820; --ok:#5fd394; --ok-bg:#12301f;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

.brand{font:700 1.35rem/1.1 var(--f-display);letter-spacing:-.01em;margin:0;flex:1 1 auto;min-width:0;text-wrap:balance}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}

.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 8px;background:var(--surface);font-size:.85rem;font-weight:500;display:inline-flex;align-items:center;gap:6px}

.post{display:block;width:100%;text-align:left;border:0;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));border-radius:5px;padding:4px 6px;font-size:.78rem;line-height:1.3}

.st-schvalene{background:var(--ok-bg);color:var(--ok)}
.st-publikovane{background:var(--fg);color:var(--bg)}
.pill.late{background:var(--bad-bg);color:var(--bad)}
aside.rail{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}

.mini .x span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--muted);font-size:.9rem}
.legend{display:flex;flex-direction:column;gap:6px;font-size:.85rem}

.overlay{position:fixed;inset:0;background:rgba(10,16,28,.5);z-index:20;display:flex;justify-content:flex-end}

.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.checks{display:flex;flex-wrap:wrap;gap:6px}

.checks input{accent-color:var(--accent)}
.links{display:flex;flex-direction:column;gap:6px}
.link-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) auto;gap:6px}
.link-row input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;min-width:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
.actions .left{margin-right:auto}
.caption{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:.92rem;overflow-wrap:anywhere}
.drive{display:flex;flex-direction:column;gap:6px}
.drive a{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--fg);text-decoration:none;font-weight:500;overflow-wrap:anywhere}
.drive a:hover{border-color:var(--accent);color:var(--accent)}
.drive a::before{content:"↗";font-family:var(--f-mono);color:var(--accent)}
.kv{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.client-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.client-row input[type=color]{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--bg)}
.client-row input[type=text]{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;min-width:0;width:100%}
.share-box{background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;font:500 .78rem var(--f-mono);overflow-wrap:anywhere;user-select:all}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:40;font-weight:500;box-shadow:var(--shadow)}
.note{font-size:.8rem;color:var(--muted)}
.ro-note{font-size:.82rem;color:var(--muted)}
@media (max-width:640px){.brand{font-size:1.15rem}.cal-head h2{font-size:1.2rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script id="app-script">
(function(){

const SKELETON_HEAD = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>';
const PLATFORMS = ["Instagram","Facebook","TikTok","LinkedIn","YouTube"];
const FORMATS = ["Reel","Karusel","Príspevok","Story","Video","Live"];
const STATUSES = [
  ["napad","Nápad"],["priprava","Pripravuje sa"],["schvalenie","Na schválenie"],["schvalene","Schválené"],["publikovane","Publikované"]
];
const STATUS_LABEL = Object.fromEntries(STATUSES);
const PALETTE = ["#c2410c","#0e7490","#7c3aed","#be185d","#15803d","#a16207","#1d4ed8","#4b5563"];
const MONTHS = ["január","február","marec","apríl","máj","jún","júl","august","september","október","november","december"];
const DOW = ["Po","Ut","St","Št","Pi","So","Ne"];
const DOW_LONG = ["pondelok","utorok","streda","štvrtok","piatok","sobota","nedeľa"];

let state;
try { state = JSON.parse(document.getElementById("app-data").textContent); } catch(e){ state = {clients:[],posts:[]}; }
state.clients = state.clients || []; state.posts = state.posts || [];

const ui = loadUi();
let canWrite = false;      // becomes true only for viewers who may save
let artifactApi = null;
let saving = false;

function loadUi(){
  const d = {month:null, filter:"all", view: window.innerWidth < 760 ? "list" : "month"};
  try { const s = JSON.parse(sessionStorage.getItem("kal-ui")||"null"); if (s) Object.assign(d,s); } catch(e){}

}
function stashUi(){ try { sessionStorage.setItem("kal-ui", JSON.stringify({month:ui.month, filter:ui.filter})); } catch(e){} }

// ---------- dates ----------
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayIso = () => iso(new Date());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
function dayLabel(s){ const d = parse(s); return DOW_LONG[(d.getDay()+6)%7]+" "+d.getDate()+". "+MONTHS[d.getMonth()]; }
function shortDate(s){ const d = parse(s); return DOW[(d.getDay()+6)%7]+" "+d.getDate()+"."+(d.getMonth()+1)+"."; }
if (!ui.month) { const t = new Date(); ui.month = t.getFullYear()+"-"+pad(t.getMonth()+1); }

// ---------- helpers ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + "-" + Math.random().toString(36).slice(2,9);

function nowTime(){ const d = new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function safeUrl(u){ try { const x = new URL(u); return (x.protocol==="https:"||x.protocol==="http:") ? x.href : ""; } catch(e){ return ""; } }
function sortPosts(a,b){ return (a.date+(a.time||"99:99")).localeCompare(b.date+(b.time||"99:99")); }

function clientViewId(){
  const h = location.hash.replace(/^#/,"");
  if (h.startsWith("k-")) { const id = "c-"+h.slice(2); if (clientById(id)) return id; }
  return null;
}
function visiblePosts(){
  const cv = clientViewId();
  if (cv) return state.posts.filter(p => p.clientId === cv);
  if (ui.filter !== "all") return state.posts.filter(p => p.clientId === ui.filter);
  return state.posts;
}

const app = document.getElementById("app");
function render(){

  if (late.length) html += `<button type="button" class="alert bad btn ghost" data-open="${esc(late[0].id)}">⚠ Zmeškané, nezverejnené: ${late.length}</button>`;
  if (today.length) html += `<button type="button" class="alert warn btn ghost" data-open="${esc(today[0].id)}">● Dnes zverejniť: ${today.length} (${today.map(p=>p.time||"").filter(Boolean).join(", ")})</button>`;
  if (waiting.length) html += `<span class="alert warn">Čaká na schválenie: ${waiting.length}</span>`;
  if (!late.length && !today.length) html += `<span class="alert ok">✓ Na dnes nič nečaká</span>`;
  html += `</div>`;

  html += `<main><section aria-label="Kalendár">`;
  const [y,m] = ui.month.split("-").map(Number);
  html += `<div class="cal-head">
    <button class="btn" type="button" data-act="prev" aria-label="Predchádzajúci mesiac">←</button>
    <button class="btn" type="button" data-act="next" aria-label="Ďalší mesiac">→</button>
    <h2>${MONTHS[m-1]} ${y}</h2>
    <button class="btn ghost" type="button" data-act="today">Dnes</button>
    <div class="seg" role="group" aria-label="Zobrazenie">
      <button type="button" data-view="month" aria-pressed="${ui.view==="month"}">Mesiac</button>
      <button type="button" data-view="list" aria-pressed="${ui.view==="list"}">Zoznam</button>
    </div></div>`;
  html += ui.view === "month" ? monthGrid(y,m,posts,editing) : agenda(y,m,posts);
  html += `</section><aside class="rail">${railHtml(posts, cv)}</aside></main></div>`;
  html += `<div id="sheet-root"></div><div id="toast-root"></div>`;
  app.innerHTML = html;
}

function postChip(p){
  const c = clientById(p.clientId);
  const cls = ["post"]; if (p.status==="publikovane") cls.push("done"); else if (isLate(p)) cls.push("late");
  return `<button type="button" class="${cls.join(" ")}" style="--c:${esc(colorOf(p.clientId))}" data-open="${esc(p.id)}" title="${esc((c?c.name+" · ":"")+p.title)}">
    <span class="t">${esc(p.time||"")} ${esc(p.format||"")}</span><span class="n">${esc(p.title||"Bez názvu")}</span></button>`;
}
function monthGrid(y,m,posts,editing){
  const first = new Date(y,m-1,1);
  const start = new Date(first); start.setDate(1 - ((first.getDay()+6)%7));
  const t = todayIso();
  let h = `<div class="grid-scroll"><div class="grid">` + DOW.map(d=>`<div class="dow">${d}</div>`).join("");
  for (let i=0;i<42;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    if (i===35 && d.getMonth() !== m-1) break;
    const s = iso(d);
    const dayPosts = posts.filter(p=>p.date===s);
    h += `<div class="day${d.getMonth()!==m-1?" out":""}${s===t?" today":""}">
      <div class="num"><span>${d.getDate()}</span>${editing?`<button type="button" class="add" data-new="${s}" aria-label="Pridať príspevok na ${d.getDate()}.${d.getMonth()+1}.">+</button>`:""}</div>
      ${dayPosts.map(postChip).join("")}</div>`;
  }
  return h + `</div></div>`;
}
function agenda(y,m,posts){
  const prefix = y+"-"+pad(m);
  const list = posts.filter(p=>p.date.startsWith(prefix));
  if (!list.length) return `<p class="empty">V tomto mesiaci zatiaľ nie je naplánovaný žiadny obsah.${canWrite && !clientViewId() ? " Pridaj ho tlačidlom „+ Nový príspevok“." : ""}</p>`;
  const t = todayIso();
  const byDay = {};
  list.forEach(p => (byDay[p.date] = byDay[p.date] || []).push(p));
  return `<div class="agenda">` + Object.keys(byDay).sort().map(d => `<div class="agenda-day${d===t?" today":""}"><h3>${d===t?"Dnes · ":""}${dayLabel(d)}</h3>${byDay[d].map(cardHtml).join("")}</div>`).join("") + `</div>`;
}
function statusPill(p){
  if (isLate(p) && p.date < todayIso()) return `<span class="pill late">Zmeškané · ${esc(STATUS_LABEL[p.status]||"")}</span>`;
  return `<span class="pill st-${esc(p.status)}">${esc(STATUS_LABEL[p.status]||p.status)}</span>`;
}
function cardHtml(p){
  const c = clientById(p.clientId);
  return `<button type="button" class="card" style="--c:${esc(colorOf(p.clientId))}" data-open="${esc(p.id)}">
    <span class="time">${esc(p.time||"–")}</span>
    <span class="title">${esc(p.title||"Bez názvu")}</span>
    <span class="meta">${c?`<span>${esc(c.name)}</span>·`:""}<span>${esc(p.format||"")}</span>·<span>${esc((p.platforms||[]).join(", "))}</span>${statusPill(p)}</span>
    ${p.caption?`<span class="cap">${esc(p.caption)}</span>`:""}
  </button>`;
}
function railHtml(posts, cv){
  const t = todayIso();
  const end = new Date(); end.setDate(end.getDate()+7);
  const next = posts.filter(p => p.date >= t && p.date <= iso(end) && p.status !== "publikovane");
  let h = `<div class="panel"><h3>Najbližších 7 dní</h3>`;
  h += next.length ? `<div class="mini">${next.map(p=>`<button type="button" data-open="${esc(p.id)}"><span class="d">${p.date===t?"DNES":esc(shortDate(p.date))}<br>${esc(p.time||"")}</span><span class="x"><span class="dot" style="--c:${esc(colorOf(p.clientId))}"></span><span>${esc(p.title||"Bez názvu")}</span></span></button>`).join("")}</div>`
    : `<p class="empty">Na najbližší týždeň nie je nič naplánované.</p>`;
  h += `</div>`;
  if (!cv) {
    h += `<div class="panel"><h3>Stav príspevkov</h3><div class="legend">${STATUSES.map(([k,l])=>`<div><span class="pill st-${k}">${l}</span><span class="note">${posts.filter(p=>p.status===k).length}×</span></div>`).join("")}</div></div>`;
  } else {
    h += `<div class="panel"><h3>Ako čítať tento plán</h3><p class="note">Kliknite na príspevok a uvidíte text, ktorý pôjde von, a odkazy na videá a grafiky v Google Drive. Stav „Na schválenie“ znamená, že čakáme na vaše potvrdenie.</p></div>`;
  }
  if (!canWrite) h += `<p class="ro-note">Len na čítanie. Zmeny robí správca kalendára.</p>`;
  return h;
}

// ---------- sheets ----------
function openSheet(inner){
  const root = document.getElementById("sheet-root");
  root.innerHTML = `<div class="overlay" data-act="close-bg"><div class="sheet" role="dialog" aria-modal="true">${inner}</div></div>`;
  const f = root.querySelector("input,select,textarea,button"); if (f) f.focus();
}
function closeSheet(){ const r = document.getElementById("sheet-root"); if (r) r.innerHTML = ""; }

function gcalLink(p){
  const c = clientById(p.clientId);
  const start = p.date.replace(/-/g,"") + "T" + (p.time||"09:00").replace(":","") + "00";
  const d = parse(p.date); const [hh,mm] = (p.time||"09:00").split(":").map(Number);
  d.setHours(hh, mm+30);
  const end = iso(d).replace(/-/g,"") + "T" + pad(d.getHours()) + pad(d.getMinutes()) + "00";
  const txt = "Postnúť: " + (c?c.name+" – ":"") + (p.title||"");
  const details = [(p.platforms||[]).join(", ")+" · "+(p.format||""), "", p.caption||"", "", ...(p.links||[]).map(l=>l.label+": "+l.url)].join("\n");
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(txt)+"&dates="+start+"/"+end+"&details="+encodeURIComponent(details.slice(0,1500));
}

}

  if (!state.clients.length) { showClients(true); return; }
  const p = id ? state.posts.find(x=>x.id===id) : {id:null, clientId: ui.filter!=="all"?ui.filter:state.clients[0].id, date: date||todayIso(), time:"18:00", platforms:["Instagram"], format:"Reel", status:"napad", title:"", caption:"", links:[{label:"",url:""}], notes:""};

    <div style="display:flex;flex-direction:column;gap:14px;margin-top:14px">

    </div>
    <div class="field"><span class="lbl">Platformy</span><div class="checks">${PLATFORMS.map((x,i)=>`<label for="f-pl-${i}"><input id="f-pl-${i}" type="checkbox" name="platforms" value="${x}"${(p.platforms||[]).includes(x)?" checked":""}>${x}</label>`).join("")}</div></div>
    <div class="field"><label for="f-caption">Text príspevku (caption)</label><textarea id="f-caption" name="caption" placeholder="Text, hashtagy, CTA…">${esc(p.caption)}</textarea></div>

let linkSeq = 100;
function linkRow(l,i){ const n = i ?? linkSeq++; return `<div class="link-row"><input id="f-ll-${n}" aria-label="Popis odkazu" placeholder="Popis (Video, Cover…)" value="${esc(l.label)}" data-k="label"><input id="f-lu-${n}" aria-label="URL adresa" placeholder="https://drive.google.com/…" value="${esc(l.url)}" data-k="url" inputmode="url"><button class="btn ghost" type="button" data-act="rm-link" aria-label="Odstrániť odkaz">✕</button></div>`; }

function showClients(firstRun){
  const base = ARTIFACT_URL || "";
  openSheet(`<div class="sheet-head"><h2>Klienti a zdieľanie</h2><button class="btn ghost" type="button" data-act="close" aria-label="Zavrieť">✕</button></div>

    <p class="note">Každý klient má vlastný odkaz. Majiteľ firmy po otvorení uvidí iba svoj plán a nemôže nič meniť. Interné poznámky sa mu nezobrazia.</p>

function toast(msg){
  const r = document.getElementById("toast-root"); if (!r) return;
  r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast._t); toast._t = setTimeout(()=>{ r.innerHTML=""; }, 2600);
}
async function copyText(text){
  try { await navigator.clipboard.writeText(text); toast("Skopírované"); }
  catch(e){ toast("Kopírovanie nefunguje, označ text a skopíruj ho ručne"); }
}

// ---------- saving ----------
function buildDocument(){
  const style = document.getElementById("app-style").outerHTML;
  const script = document.getElementById("app-script").textContent;
  const fonts = '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">';
  const data = JSON.stringify(state).replace(/</g,"\\u003c");
  return SKELETON_HEAD + '<title>Obsahový kalendár</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n' + fonts + "\n" + style +
    '\n<div id="app"></div>\n<script type="application/json" id="app-data">' + data + '<\/script>\n<script id="app-script">' + script + '<\/script>\n</body></html>';
}
async function save(msg){
  if (!artifactApi || !canWrite) { toast("Ukladanie tu nie je dostupné"); return false; }
  if (saving) return false;
  saving = true; stashUi(); toast("Ukladám…");
  try { await artifactApi.publish(buildDocument()); toast(msg || "Uložené"); return true; }
  catch(e){
    const code = e && e.code;
    if (code === "conflict") { toast("Kalendár sa medzitým zmenil, načítavam najnovšiu verziu"); }
    else if (["not_writer","not_granted","not_declared","consent_required","capability_disabled","capability_removed"].includes(code)) { canWrite = false; render(); toast("Tento náhľad je len na čítanie"); }
    else if (code === "rate_limited") toast("Príliš veľa ukladaní naraz, skús o chvíľu");
    else toast("Uloženie zlyhalo, skús to znova");
    return false;
  } finally { saving = false; }
}

// ---------- events ----------
app.addEventListener("click", async (ev) => {
  const el = ev.target.closest("[data-act],[data-open],[data-filter],[data-view],[data-new],[data-edit],[data-done],[data-del],[data-dup],[data-copy],[data-share],[data-preview],[data-delclient]");
  if (!el) return;
  const d = el.dataset;
  if (d.act === "close-bg") { if (ev.target === el) closeSheet(); return; }
  if (d.open) return showPost(d.open);
  if (d.filter) { ui.filter = d.filter; stashUi(); return render(); }
  if (d.view) { ui.view = d.view; try{localStorage.setItem("kal-view",d.view);}catch(e){} return render(); }
  if (d.new) return editPost(null, d.new);
  if (d.edit) return editPost(d.edit);
  if (d.copy) { const p = state.posts.find(x=>x.id===d.copy); return copyText(p ? p.caption : ""); }
  if (d.done) { const p = state.posts.find(x=>x.id===d.done); if (p) { p.status = "publikovane"; closeSheet(); render(); await save("Označené ako zverejnené"); } return; }
  if (d.dup) { const p = state.posts.find(x=>x.id===d.dup); if (p) { const n = JSON.parse(JSON.stringify(p)); n.id = null; n.status = "napad"; editPostFrom(n); } return; }
  if (d.del) {
    if (el.dataset.armed !== "1") { el.dataset.armed = "1"; el.textContent = "Naozaj vymazať?"; return; }
    state.posts = state.posts.filter(x=>x.id!==d.del); closeSheet(); render(); await save("Príspevok vymazaný"); return;
  }
  if (d.share) { return copyText((ARTIFACT_URL||"") + "#k-" + d.share.replace(/^c-/,"")); }
  if (d.preview) { closeSheet(); location.hash = "k-" + d.preview.replace(/^c-/,""); return; }
  if (d.delclient) {
    const n = state.posts.filter(p=>p.clientId===d.delclient).length;
    if (el.dataset.armed !== "1") { el.dataset.armed = "1"; el.textContent = n ? `Vymazať aj ${n} príspevkov?` : "Naozaj?"; return; }
    state.clients = state.clients.filter(c=>c.id!==d.delclient);
    state.posts = state.posts.filter(p=>p.clientId!==d.delclient);
    if (ui.filter === d.delclient) ui.filter = "all";
    el.closest(".client-row").remove(); return;
  }
  switch (d.act) {
    case "close": return closeSheet();
    case "new": return editPost(null);
    case "clients": return showClients(false);
    case "prev": case "next": {
      const [y,m] = ui.month.split("-").map(Number); const dt = new Date(y, m-1 + (d.act==="next"?1:-1), 1);
      ui.month = dt.getFullYear()+"-"+pad(dt.getMonth()+1); stashUi(); return render();
    }
    case "today": { const t = new Date(); ui.month = t.getFullYear()+"-"+pad(t.getMonth()+1); stashUi(); return render(); }
    case "exit-client": history.replaceState(null,"",location.pathname+location.search); return render();
    case "add-link": document.getElementById("links").insertAdjacentHTML("beforeend", linkRow({label:"",url:""})); return;
    case "rm-link": el.closest(".link-row").remove(); return;
    case "add-client": {
      const inp = document.getElementById("new-client"); const name = inp.value.trim(); if (!name) { inp.focus(); return; }
      readClientRows();
      const slug = name.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,24) || "klient";
      let id = "c-"+slug; if (clientById(id)) id = "c-"+slug+"-"+Math.random().toString(36).slice(2,5);
      state.clients.push({id, name, color: PALETTE[state.clients.length % PALETTE.length]});
      return showClients(false);
    }
    case "save-clients": readClientRows(); closeSheet(); render(); await save("Klienti uložení"); return;
  }
});
function readClientRows(){
  document.querySelectorAll("#client-list .client-row").forEach(row => {
    const c = clientById(row.dataset.cid); if (!c) return;
    c.name = row.querySelector('input[type=text]').value.trim() || c.name;
    c.color = row.querySelector('input[type=color]').value;
  });
}
function editPostFrom(n){ editPost(null); const f = document.getElementById("post-form"); if (!f) return;
  f.title.value = n.title + " (kópia)"; f.clientId.value = n.clientId; f.time.value = n.time||""; f.format.value = n.format; f.caption.value = n.caption||""; f.notes.value = n.notes||"";
  f.querySelectorAll('input[name=platforms]').forEach(cb => cb.checked = (n.platforms||[]).includes(cb.value));
  document.getElementById("links").innerHTML = (n.links&&n.links.length?n.links:[{label:"",url:""}]).map(l=>linkRow(l)).join("");
}
app.addEventListener("submit", async (ev) => {
  if (ev.target.id !== "post-form") return;
  ev.preventDefault();
  const f = ev.target;
  if (!f.title.value.trim()) { f.title.focus(); toast("Doplň názov príspevku"); return; }
  if (!f.date.value) { f.date.focus(); toast("Vyber dátum"); return; }
  const links = [...f.querySelectorAll(".link-row")].map(r => ({label: r.querySelector('[data-k=label]').value.trim(), url: r.querySelector('[data-k=url]').value.trim()})).filter(l => l.url);
  const bad = links.find(l => !safeUrl(l.url));
  if (bad) { toast("Odkaz musí začínať https://"); return; }
  const data = {
    clientId: f.clientId.value, status: f.status.value, date: f.date.value, time: f.time.value, format: f.format.value,
    platforms: [...f.querySelectorAll('input[name=platforms]:checked')].map(x=>x.value),
    title: f.title.value.trim(), caption: f.caption.value, links, notes: f.notes.value
  };
  const id = f.querySelector('input[name=id]').value;
  if (id) Object.assign(state.posts.find(p=>p.id===id), data);
  else state.posts.push(Object.assign({id: uid("p")}, data));
  ui.month = data.date.slice(0,7);
  closeSheet(); render(); await save("Príspevok uložený");
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
window.addEventListener("hashchange", render);

render();

// ---------- capabilities ----------
(async () => {
  if (!window.claude || !window.claude.use) return;
  try {
    const [art, user] = await Promise.all([window.claude.use("artifact"), window.claude.use("user")]);
    artifactApi = art;
    const editor = user ? (user.isOwner() || user.canEdit()) : false;
    if (art && editor) { canWrite = true; render(); }
  } catch(e) {}
})();
})();
</script>
